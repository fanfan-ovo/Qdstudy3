<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - AI助教答疑平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #eff6ff 100%);
      padding: 20px;
    }

    .card {
      width: 420px;
      max-width: 94vw;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.18);
      padding: 40px 36px 36px;
    }

    .logo {
      text-align: center;
      margin-bottom: 8px;
    }

    .logo .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
    }

    h1 {
      font-size: 24px;
      color: #1e3a5f;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 26px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #334155;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus,
    select:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
    }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #94a3b8;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
    }

    button[type="submit"]:hover {
      opacity: 0.92;
    }

    button[type="submit"]:active {
      transform: translateY(1px);
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #64748b;
    }

    .switch a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }

    .switch a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="icon">🎓</div>
    </div>
    <h1>AI助教答疑平台</h1>
    <p class="subtitle">创建账号，开启智能答疑之旅</p>

    <form action="#" method="post">
      <div class="field">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username"
               placeholder="请输入用户名（4-20位字母或数字）"
               pattern="[A-Za-z0-9]{4,20}"
               title="用户名需为4-20位字母或数字"
               required autofocus autocomplete="username">
      </div>

      <div class="field">
        <label for="email">邮箱</label>
        <input type="email" id="email" name="email"
               placeholder="请输入邮箱地址"
               required autocomplete="email">
      </div>

      <div class="field">
        <label for="phone">手机号</label>
        <input type="tel" id="phone" name="phone"
               placeholder="请输入11位手机号"
               pattern="1[3-9][0-9]{9}"
               title="请输入以1开头的11位有效手机号"
               required autocomplete="tel">
        <span class="hint">例如：13800000000</span>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password"
               placeholder="请输入密码（至少6位）"
               minlength="6"
               required autocomplete="new-password">
      </div>

      <div class="field">
        <label for="confirm">确认密码</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="请再次输入密码"
               minlength="6"
               required autocomplete="new-password">
      </div>

      <div class="field">
        <label for="role">身份</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>请选择您的身份</option>
          <option value="student">学生</option>
          <option value="teacher">教师</option>
        </select>
      </div>

      <button type="submit">注 册</button>
    </form>

    <p class="switch">已有账号？<a href="login.html">直接登录</a></p>
  </div>
</body>
</html>
